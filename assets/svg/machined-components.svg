<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="componentsTitle componentsDesc">
  <title id="componentsTitle">Machined Components</title>
  <desc id="componentsDesc">Finished precision rings, bushes and flanges of varying diameters after CNC turning.</desc>
  <defs>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7490c6"/>
      <stop offset="1" stop-color="#224d9c"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="400" cy="492" rx="340" ry="24" fill="rgba(18,42,85,0.12)"/>

  <!-- large flange (500mm) -->
  <ellipse cx="280" cy="270" rx="200" ry="60" fill="url(#m3)"/>
  <ellipse cx="280" cy="252" rx="200" ry="60" fill="url(#m2)"/>
  <ellipse cx="280" cy="252" rx="120" ry="36" fill="url(#m1)"/>
  <ellipse cx="280" cy="252" rx="120" ry="36" fill="url(#shine)"/>
  <circle cx="280" cy="252" r="16" fill="url(#m2)"/>

  <!-- flange bolt holes -->
  <circle cx="280" cy="196" r="9" fill="#334155"/>
  <circle cx="374" cy="252" r="9" fill="#334155"/>
  <circle cx="186" cy="252" r="9" fill="#334155"/>
  <circle cx="340" cy="312" r="9" fill="#334155"/>
  <circle cx="220" cy="312" r="9" fill="#334155"/>

  <!-- steel bushing -->
  <rect x="470" y="330" width="250" height="70" rx="14" fill="url(#m2)"/>
  <rect x="482" y="342" width="226" height="46" rx="10" fill="url(#m1)"/>
  <rect x="560" y="352" width="70" height="26" rx="6" fill="rgba(71,85,105,0.45)"/>
  <ellipse cx="560" cy="365" rx="4" ry="10" fill="#334155"/>
  <ellipse cx="630" cy="365" rx="4" ry="10" fill="#334155"/>

  <!-- small rings stack -->
  <ellipse cx="230" cy="412" rx="110" ry="30" fill="url(#m2)"/>
  <ellipse cx="230" cy="398" rx="110" ry="30" fill="url(#m1)"/>
  <ellipse cx="230" cy="398" rx="64" ry="17" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="230" cy="398" rx="22" ry="6" fill="url(#m2)"/>

  <ellipse cx="520" cy="416" rx="90" ry="24" fill="url(#m2)"/>
  <ellipse cx="520" cy="404" rx="90" ry="24" fill="url(#m1)"/>
  <ellipse cx="520" cy="404" rx="50" ry="13" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="520" cy="404" rx="18" ry="5" fill="url(#m2)"/>

  <!-- sparkle highlights -->
  <path d="M 210 240 l 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#f2b41c" opacity="0.9"/>
  <path d="M 560 320 l 5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z" fill="#f2b41c" opacity="0.7"/>

  <!-- labels -->
  <text x="150" y="236" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff">500 mm OD</text>
  <text x="520" y="300" font-family="DM Sans, sans-serif" font-size="18" font-weight="600" fill="#224d9c">Bushes</text>
  <text x="180" y="380" font-family="DM Sans, sans-serif" font-size="18" font-weight="600" fill="#224d9c">Rings</text>
  <text x="196" y="164" font-family="DM Sans, sans-serif" font-size="24" font-weight="700" fill="#224d9c">Machined Components</text>
</svg>
