<header class="main-header" [class.scrolled]="isScrolled">
  <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="#home" (click)="navigateToSection('home', $event)" aria-label="Khodiyar Krupa Ring Turning Home">
        <img src="assets/logo/logo.jpeg" alt="Khodiyar Krupa Ring Turning - CNC Job Work and Ring Manufacturing" class="logo">
      </a>

      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle menu"
        touch-action="manipulation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="nav-overlay"
        [class.show]="isMenuOpen"
        (pointerdown)="closeMenu($event)"
        (click)="closeMenu($event)"
        role="presentation"
        aria-hidden="true"
      ></div>

      <div class="collapse navbar-collapse" [class.show]="isMenuOpen" [style.top.px]="mobileMenuTop" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" *ngFor="let item of navItems">
            <a
              class="nav-link"
              [class.active]="item.active"
              [attr.aria-current]="item.active ? 'true' : null"
              href="#{{ item.target }}"
              (click)="navigateToSection(item.target, $event)"
            >{{ item.label }}</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
